<!DOCTYPE html>
<html>
<head>
  <title>Pyramid Pattern</title>
  <style>
    pre {
      font-family: monospace;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <h1>Star Pyramid</h1>
  <pre id="pyramid"></pre>

  <script>
    const rows = 5; // You can change this for a bigger pyramid
    let pyramid = "";

    for (let i = 1; i <= rows; i++) {
      // Add spaces
      for (let j = 1; j <= rows - i; j++) {
        pyramid += " ";
      }

      // Add stars
      for (let k = 1; k <= 2 * i - 1; k++) {
        pyramid += "*";
      }

      // Move to the next line
      pyramid += "\n";
    }

    document.getElementById("pyramid").textContent = pyramid;
  </script>
</body>
</html>
