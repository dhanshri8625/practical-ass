<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Events Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f0f0f0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    button, input {
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #hoverBox {
      width: 100%;
      padding: 20px;
      background-color: #d1ecf1;
      text-align: center;
      margin-top: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .output {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>JavaScript Events Demonstration</h2>
    <button onclick="onClickEvent()">Click Me</button><br>
    <input type="text" id="textInput" onkeyup="onKeyUpEvent()" placeholder="Type something..."><br>
    <div id="hoverBox" onmouseover="onMouseOver()" onmouseout="onMouseOut()">
      Hover over this box
    </div>
    <p class="output" id="outputText"></p>
  </div>
  <script>
    function onClickEvent() {
      document.getElementById("outputText").innerHTML = "Button was clicked!";
    }
    function onKeyUpEvent() {
      let input = document.getElementById("textInput").value;
      document.getElementById("outputText").innerHTML = "You typed: " + input;
    }

    function onMouseOver() {
      document.getElementById("hoverBox").style.backgroundColor = "#c3e6cb";
      document.getElementById("outputText").innerHTML = "Mouse is over the box!";
    }
    function onMouseOut() {
      document.getElementById("hoverBox").style.backgroundColor = "#d1ecf1";
      document.getElementById("outputText").innerHTML = "Mouse left the box.";
    }
  </script>
</body>
</html>
